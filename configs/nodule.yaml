# Binary variant: NoduleMNIST3D (LIDC-IDRI), central axial slice.
seed: 20260915

dataset:
  name: nodulemnist3d
  size: 28                 # the 3-D subsets are published at 28 and 64
  root: data
  reconstruct: true    # train on reconstructed images (see data/datasets.py)
  subset: {}

model:
  name: smallcnn
  width: 16
  dropout: 0.3

train:
  epochs: 20
  batch_size: 128
  lr: 0.003
  weight_decay: 0.0001
  device: null
  checkpoint: results/model_nodule.pt

experiment:
  out_dir: results/nodule
  explainers: [gradcam, integrated_gradients]
  perturbations: [dose, kernel, hu_shift, contrast, blur]
  n_eval: 500
  n_explain: 64
  n_faithfulness: 32
  n_sanity: 8
  faithfulness_steps: 32
  explainer_kwargs:
    integrated_gradients:
      steps: 32
