[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-xai-qc"
version = "0.1.0"
description = "A quality-control protocol for saliency-based explanations in CT imaging"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Arianna Ruiz Vossirini" }]
keywords = ["explainable-ai", "medical-imaging", "computed-tomography", "robustness", "quality-assurance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "torch>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "scikit-learn>=1.3",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "tabulate>=0.9",
]

[project.optional-dependencies]
data = ["medmnist>=3.0"]
dev = ["pytest>=7.4", "ruff>=0.5"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.29"]

[project.scripts]
ctxaiqc-train = "ctxaiqc.train:main"
ctxaiqc-evaluate = "ctxaiqc.evaluate:main"
ctxaiqc-experiment = "ctxaiqc.run_experiment:main"
ctxaiqc-report = "ctxaiqc.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
